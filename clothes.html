<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        background-color: antiquewhite;
        width: 500px;
        height: auto;
        border: 2px solid black;
        margin-left: 200px;
        margin-top: 200px;
        padding: 20px;
    }
    h1{
        text-align: center;
    }
    .form-group{
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
    }
    label{
        
        text-align: left;
        margin-left: 0px;
    }
    input{
        flex: 2;
        width: 150px;
    }
    button{
        margin-left: 0;
        display: block;
    }
    #table{
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }
    th, td{
        border: 1px solid black;
        padding: 8px;
        text-align: center;
    }
    th{
        background-color: lightgray;
    }
    tfoot td{
        font-weight: bold;
        text-align: right;
    }
    #total{
        text-align: center;
    }
</style>
<body>
    <div class="container">
        <h1>Clothes</h1>
        <form name="form2">
            <div class="form-group">
                <label for="pName">Product Name:</label>
                <input type="text" name="pName" id="pName">
            </div>
            <div class="form-group">
                <label for="pQty">Product Quantity:</label>
                <input type="number" name="pQty" id="pQty">
            </div>
            <div class="form-group">
                <label for="pPrice">Product Price:</label>
                <input type="number" name="pPrice" id="pPrice">
            </div>
            <button type="button" onclick="Add()">Add</button>
            <table id="table">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Product</th>
                        <th>Quantity</th>
                        <th>Price</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="4" style="text-align: left;">Total</td>
                        <td id="total">0</td>
                    </tr>
                </tfoot>
            </table>
        </form>
    </div>
</body>
<script>
    var id = 0;
    var total = 0;

    function Add(){
        id++;
        var pn = document.getElementById("pName").value;
        var pQty = document.getElementById("pQty").value;
        var pp = document.getElementById("pPrice").value;
        var sub = pQty * pp;
        total += sub;
        var row = "<tr>";
        row += "<td>" + id + "</td>";
        row += "<td>" + pn + "</td>";
        row += "<td>" + pQty + "</td>";
        row += "<td>" + pp + "</td>";
        row += "<td>" + sub + "</td>";
        row += "</tr>";
        document.querySelector("#table tbody").innerHTML += row;
        document.getElementById("total").innerHTML = total;
    }
</script>
</html>
